<!doctype html>
<html lang="de">

<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05070b;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}#stage{position:fixed;inset:0;overflow:hidden;touch-action:none;background:#05070b}#stage>canvas.scene{position:absolute;inset:0;width:100%;height:100%;display:block}#ui{position:absolute;z-index:10;inset:12px 12px auto 12px;display:flex;justify-content:space-between;gap:10px;pointer-events:none}.panel{pointer-events:auto;background:rgba(8,11,16,.84);border:1px solid rgba(255,255,255,.12);border-radius:16px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}#statusBox{padding:10px 12px;min-width:175px;max-width:64vw}#status{font-weight:800;font-size:14px}#detail{margin-top:5px;font:11px/1.35 ui-monospace,monospace;color:rgba(255,255,255,.62);white-space:pre-line}#buttons{display:flex;flex-direction:column;gap:7px;pointer-events:auto}button{min-height:44px;border-radius:14px;border:1px solid rgba(255,255,255,.13);background:rgba(22,28,38,.93);color:#fff;padding:0 12px;font-weight:800;font-size:13px}button.primary{background:#f5f7fb;color:#10141b}button:disabled{opacity:.48}#hint{position:absolute;z-index:9;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translateX(-50%);width:min(90vw,500px);padding:11px 13px;border-radius:15px;text-align:center;border:1px solid rgba(255,255,255,.09);background:rgba(8,11,16,.68);font-size:12px;line-height:1.4;color:rgba(255,255,255,.72);pointer-events:none}#fatal{display:none;position:absolute;z-index:50;inset:auto 12px 84px 12px;padding:12px;border-radius:14px;background:rgba(90,20,20,.94);font:12px/1.4 ui-monospace,monospace;white-space:pre-wrap;max-height:45vh;overflow:auto}#debug{position:absolute;z-index:20;left:12px;right:12px;top:170px;max-height:56vh;display:none;grid-template-columns:minmax(140px,42%) 1fr;gap:10px;padding:10px;overflow:auto}.cameraBox{position:relative;aspect-ratio:4/3;background:#000;border-radius:12px;overflow:hi </style>
</head>
<body>
<main id="stage">
<div id="ui"><div id="statusBox" class="panel"><div id="status">Initialisiere …</div><div id="detail">JS startet</div></div><div id="buttons"><button id="startBtn" class="primary" disabled>Spatial starten</button><button id="debugBtn">Debug öffnen</button><button id="calBtn" disabled>Kalibrieren</button></div></div>
<section id="debug" class="panel"><div class="cameraBox"><video id="video" autoplay muted playsinline></video><canvas id="faceCanvas"></canvas></div><div id="debugText">Debug bereit.</div></section>
<div id="hint">Ziehe zunächst mit dem Finger über das Display. Danach „Spatial starten“ und Kamera erlauben.</div><div id="fatal"></div>
</main>
<script type="module">
const $=id=>document.getElementById(id),stage=$("stage"),video=$("video"),faceCanvas=$("faceCanvas"),faceCtx=faceCanvas.getContext("2d"),statusEl=$("status"),detailEl=$("detail"),startBtn=$("startBtn"),debugBtn=$("debugBtn"),debugEl=$("debug"),debugText=$("debugText"),calBtn=$("calBtn"),hintEl=$("hint"),fatalEl=$("fatal");
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),lerp=(a,b,t)=>a+(b-a)*t;
let dbg={secure:isSecureContext,protocol:location.protocol,mediaDevices:!!navigator.mediaDevices,getUserMedia:!!navigator.mediaDevices?.getUserMedia,permission:"unknown",camera:"not started",track:"-",video:"0x0",mediapipe:"not loaded",moduleUrl:"-",wasm:"not loaded",model:"not loaded",delegate:"-",faces:0,landmarks:0,fps:0,lastError:"-"};
function debugRender(){debugText.textContent=`Secure context: ${dbg.secure}\nProtocol: ${dbg.protocol}\nmediaDevices: ${dbg.mediaDevices}\ngetUserMedia: ${dbg.getUserMedia}\nCamera permission: ${dbg.permission}\nCamera: ${dbg.camera}\nTrack: ${dbg.track}\nVideo: ${dbg.video}\nMediaPipe module: ${dbg.mediapipe}\nModule URL: ${dbg.moduleUrl}\nWASM: ${dbg.wasm}\nFace model: ${dbg.model}\nDelegate: ${dbg.delegate}\nFaces: ${dbg.faces}\nLandmarks: ${dbg.landmarks}\nDetection FPS: ${dbg.fps}\n\nLast error:\n${dbg.lastError}`}
function setErr(stageName,e){const name=e?.name||"Error",msg=e?.message||String(e);dbg.lastError=`[${stageName}] ${name}: ${msg}`;debugRender();console.error(stageName,e)}
function fatal(msg){fatalEl.style.display="block";fatalEl.textContent=msg;statusEl.textContent="Fehler"}
window.addEventListener("error",e=>{setErr("window.error",e.error||e.message);fatal("JS-Fehler:\n"+(e.message||"unbekannt"))});window.addEventListener("unhandledrejection",e=>{setErr("unhandledrejection",e.reason);fatal("Promise-Fehler:\n"+(e.reason?.message||e.reason||"unbekannt"))});
let THREE,renderer,scene,camera,torus,orb,frame,model;let ready=false,drag=false,tracking=false,faceLandmarker=null,stream=null,lastVideo=-1,lastDetect=0,lastFace=0,mode="touch",detectCounter=0,fpsSince=performance.now();
const target={x:0,y:0,z:.42},smooth={x:0,y:0,z:.42},neutral={x:0,y:0,z:.42};
async function permissionInfo(){try{if(navigator.permissions?.query){const p=await navigator.permissions.query({name:"camera"});dbg.permission=p.state;p.onchange=()=>{dbg.permission=p.state;debugRender()}}}catch{dbg.permission="query unsupported"}debugRender()}
async function boot(){try{await permissionInfo();THREE=await import("https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js");renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:"high-performance"});renderer.domElement.className="scene";renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.08;renderer.shadowMap.enabled=true;stage.prepend(renderer.domElement);scene=new THREE.Scene();scene.background=new THREE.Color(0x05070b);scene.fog=new THREE.FogExp2(0x05070b,1.3);camera=new THREE.PerspectiveCamera(50,1,.008,6);scene.add(new THREE.HemisphereLight(0xbcd7ff,0x161921,1.7));const key=new THREE.DirectionalLight(0xffffff,4);key.position.set(-.35,.55,.4);key.castShadow=true;scene.add(key);const blue=new THREE.PointLight(0x7aa8ff,7,2.3,2);blue.position.set(.38,.1,-.3);scene.add(blue);const warm=new THREE.PointLight(0xffbd7d,4.5,1.8,2);warm.position.set(-.32,-.05,-.9);scene.add(warm);buildWorld();resize();addEventListener("resize",resize,{passive:true});ready=true;startBtn.disabled=false;statusEl.textContent="Bereit · HTTPS";detailEl.textContent=`Modus: touch\nEye: 0.0 / 0.0 / 42.0 cm`;requestAnimationFrame(loop)}catch(e){setErr("boot",e);fatal("Three.js konnte nicht geladen werden:\n"+(e.message||e))}}
function mesh(g,m,x,y,z){const o=new THREE.Mesh(g,m);o.position.set(x,y,z);o.castShadow=o.receiveShadow=true;scene.add(o);return o}
function buildWorld(){const floor=mesh(new THREE.PlaneGeometry(1.5,2.3),new THREE.MeshStandardMaterial({color:0x10151d,metalness:.3,roughness:.75}),0,-.24,-.95);floor.rotation.x=-Math.PI/2;const grid=new THREE.GridHelper(1.5,60,0x6d819a,0x263141);grid.position.set(0,-.238,-.95);grid.material.transparent=true;grid.material.opacity=.3;scene.add(grid);mesh(new THREE.PlaneGeometry(1.6,1.3),new THREE.MeshStandardMaterial({color:0x0b0f15,roughness:.88}),0,.18,-1.85);const rm=new THREE.MeshStandardMaterial({color:0x293342,metalness:.75,roughness:.3});for(const r of [[-.38,.08,-.95,.012,.58,1.65],[.38,.08,-.95,.012,.58,1.65],[0,.37,-.95,.76,.012,1.65]])mesh(new THREE.BoxGeometry(r[3],r[4],r[5]),rm,r[0],r[1],r[2]);frame=new THREE.Group();const fm=new THREE.MeshStandardMaterial({color:0x8793a1,metalness:.85,roughness:.22});for(const b of [[0,-.15,.47,.01],[0,.15,.47,.01],[-.235,0,.01,.30],[.235,0,.01,.30]]){const o=new THREE.Mesh(new THREE.BoxGeometry(b[2],b[3],.012),fm);o.position.set(b[0],b[1],0);frame.add(o)}frame.position.set(0,.05,-.34);scene.add(frame);torus=mesh(new THREE.TorusGeometry(.11,.015,20,72),new THREE.MeshStandardMaterial({color:0x8195aa,metalness:.85,roughness:.26}),-.18,.06,-.72);torus.rotation.set(Math.PI/2.6,Math.PI/5,0);orb=mesh(new THREE.IcosahedronGeometry(.085,2),new THREE.MeshStandardMaterial({color:0xc0cede,metalness:.42,roughness:.3}),.19,.1,-1.08);model=new THREE.Group();model.position.set(.06,-.205,-.88);scene.add(model);const bm=new THREE.MeshStandardMaterial({color:0xbcc7d4,metalness:.7,roughness:.28}),dm=new THREE.MeshStandardMaterial({color:0x11161d,roughness:.55});const body=new THREE.Mesh(new THREE.BoxGeometry(.22,.055,.105),bm);body.position.y=.035;model.add(body);const cabin=new THREE.Mesh(new THREE.BoxGeometry(.11,.05,.09),bm);cabin.position.set(-.02,.085,0);model.add(cabin);for(const x of [-.075,.075])for(const z of [-.058,.058]){const w=new THREE.Mesh(new THREE.CylinderGeometry(.027,.027,.018,24),dm);w.rotation.x=Math.PI/2;w.position.s function resize(){if(renderer)renderer.setSize(innerWidth,innerHeight,false)}function screenM(){return innerHeight>=innerWidth?{w:.068,h:.151}:{w:.151,h:.068}}
function project(e){const n=.008,f=6,s=screenM(),z=Math.max(.16,e.z),l=n*((-s.w/2)-e.x)/z,r=n*((s.w/2)-e.x)/z,b=n*((-s.h/2)-e.y)/z,t=n*((s.h/2)-e.y)/z;camera.position.set(e.x,e.y,e.z);camera.rotation.set(0,0,0);camera.projectionMatrix.makePerspective(l,r,t,b,n,f,camera.coordinateSystem);camera.projectionMatrixInverse.copy(camera.projectionMatrix).invert();camera.updateMatrixWorld(true)}
stage.addEventListener("pointerdown",e=>{if(!ready||tracking)return;drag=true;stage.setPointerCapture?.(e.pointerId);mode="touch"});stage.addEventListener("pointermove",e=>{if(!drag||tracking)return;const r=stage.getBoundingClientRect(),nx=(e.clientX-r.left)/r.width*2-1,ny=(e.clientY-r.top)/r.height*2-1;target.x=clamp(nx*.1,-.12,.12);target.y=clamp(-ny*.08,-.1,.1)});stage.addEventListener("pointerup",()=>drag=false);stage.addEventListener("pointercancel",()=>drag=false);
async function gyro(){if(!("DeviceOrientationEvent" in window))return false;let got=false;addEventListener("deviceorientation",e=>{if(typeof e.gamma!=="number")return;got=true;if(!tracking||performance.now()-lastFace>800){target.x=clamp(e.gamma/45,-1,1)*.075;target.y=clamp((e.beta-45)/45,-1,1)*-.055;target.z=.42;if(!tracking)mode="gyro"}},{passive:true});await new Promise(r=>setTimeout(r,400));return got}
async function importMediaPipe(){const urls=["https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.21/vision_bundle.mjs","https://unpkg.com/@mediapipe/tasks-vision@0.10.21/vision_bundle.mjs?module"];let last;for(const url of urls){dbg.moduleUrl=url;dbg.mediapipe="loading";debugRender();try{const mp=await import(url);dbg.mediapipe="loaded";debugRender();return mp}catch(e){last=e;setErr("MediaPipe import",e)}}dbg.mediapipe="FAILED";debugRender();throw last||new Error("MediaPipe module could not be loaded")}
async function face(){dbg.camera="requesting";debugRender();try{stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:"user",width:{ideal:640},height:{ideal:480},frameRate:{ideal:30,max:30}}})}catch(e){dbg.camera="FAILED";setErr("getUserMedia",e);throw e}dbg.camera="stream acquired";const track=stream.getVideoTracks()[0],settings=track?.getSettings?.()||{};dbg.track=track?`${track.label||"camera"} | ${track.readyState} | ${settings.width||"?"}x${settings.height||"?"}@${settings.frameRate||"?"}`:"no video track";video.srcObject=stream;try{await video.play()}catch(e){setErr("video.play",e);throw e}await new Promise(r=>{if(video.videoWidth)return r();const done=()=>{video.removeEventListener("loadedmetadata",done);r()};video.addEventListener("loadedmetadata",done);setTimeout(done,1500)});dbg.video=`${video.videoWidth}x${video.videoHeight} readyState=${video.readyState}`;dbg.camera="PLAYING";debugRender();
let mp;try{mp=await importMediaPipe()}catch(e){throw e}
let vision;dbg.wasm="loading";debugRender();try{vision=await mp.FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.21/wasm");dbg.wasm="loaded";debugRender()}catch(e){dbg.wasm="FAILED";setErr("WASM",e);throw e}
const opt={baseOptions:{modelAssetPath:"https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",delegate:"GPU"},runningMode:"VIDEO",numFaces:1,minFaceDetectionConfidence:.45,minFacePresenceConfidence:.45,minTrackingConfidence:.45};dbg.model="loading";dbg.delegate="GPU";debugRender();try{faceLandmarker=await mp.FaceLandmarker.createFromOptions(vision,opt);dbg.model="loaded"}catch(e){setErr("Face model GPU",e);dbg.delegate="CPU fallback";opt.baseOptions.delegate="CPU";debugRender();try{faceLandmarker=await mp.FaceLandmarker.createFromOptions(vision,opt);dbg.model="loaded";dbg.delegate="CPU"}catch(e2){dbg.model="FAILED";setErr("Face model CPU",e2);throw e2}}tracking=true;mode="face";calBtn.disabled=false;statusEl.textContent="Face Tracking aktiv";hintEl.textContent="Handy ruhig halten. Nur den Kopf nach links/rechts und hoch/runter bewegen.";debugRender()}
function eye(f){if(!f||f.length<474||!video.videoWidth)return null;const L=f[468],R=f[473],vw=video.videoWidth,vh=video.videoHeight,lx=L.x*vw,ly=L.y*vh,rx=R.x*vw,ry=R.y*vh,d=Math.hypot(rx-lx,ry-ly);if(d<8)return null;const fx=vw/(2*Math.tan(65*Math.PI/360)),z=clamp(fx*.063/d,.22,.85),cx=(lx+rx)/2,cy=(ly+ry)/2;return{x:clamp(((cx-vw/2)*z)/fx,-.22,.22),y:clamp(-((cy-vh/2)*z)/fx,-.18,.18),z}}

startBtn.addEventListener("click",async()=>{startBtn.disabled=true;startBtn.textContent="Starte …";debugEl.style.display="grid";debugBtn.textContent="Debug schließen";const g=await gyro();try{await face();startBtn.textContent="Spatial aktiv"}catch(e){mode=g?"gyro":"touch";statusEl.textContent=g?"Gyro aktiv":"Nur Touch möglich";hintEl.textContent="Kamera läuft ggf. bereits. Im Debug steht jetzt exakt, welche MediaPipe-Stufe fehlgeschlagen ist.";startBtn.disabled=false;startBtn.textContent="Erneut prüfen";setErr("Spatial start",e)}});
debugBtn.addEventListener("click",()=>{const open=debugEl.style.display==="grid";debugEl.style.display=open?"none":"grid";debugBtn.textContent=open?"Debug öffnen":"Debug schließen";debugRender()});
calBtn.addEventListener("click",()=>{neutral.x=smooth.x;neutral.y=smooth.y;neutral.z=smooth.z;hintEl.textContent="Kalibriert. Jetzt nur den Kopf bewegen."});
let prev=performance.now();function loop(now){requestAnimationFrame(loop);const dt=clamp((now-prev)/1000,.001,.05);prev=now;if(tracking&&faceLandmarker&&video.readyState>=2&&now-lastDetect>=50&&video.currentTime!==lastVideo){lastDetect=now;lastVideo=video.currentTime;try{const res=faceLandmarker.detectForVideo(video,now),f=res.faceLandmarks?.[0];dbg.faces=res.faceLandmarks?.length||0;dbg.landmarks=f?.length||0;detectCounter++;if(now-fpsSince>1000){dbg.fps=detectCounter;detectCounter=0;fpsSince=now;debugRender()}drawFace(f);const e=eye(f);if(e){target.x=clamp(e.x-neutral.x,-.18,.18);target.y=clamp(e.y-neutral.y,-.14,.14);target.z=e.z;lastFace=now;mode="face"}}catch(e){setErr("detectForVideo",e)}}const a=1-Math.exp(-dt*11.5);smooth.x=lerp(smooth.x,target.x,a);smooth.y=lerp(smooth.y,target.y,a);smooth.z=lerp(smooth.z,target.z,a*.7);project(smooth);if(torus)torus.rotation.z+=dt*.26;if(orb){orb.rotation.x+=dt*.22;orb.rotation.y+=dt*.31}if(frame)frame.rotation.y=Math.sin(now*.00045)*.025;if(model)model.rotation.y=Math.sin(now*.00032)*.055;detailEl.textContent=`Modus: ${mode}\nEye: ${(smooth.x*100).toFixed(1)} / ${(smooth.y*100).toFixed(1)} / ${(smooth.z*100).toFixed(1)} cm`;renderer.render(scene,camera)}
addEventListener("pagehide",()=>{try{stream?.getTracks().forEach(t=>t.stop())}catch{}try{faceLandmarker?.close?.()}catch{}});debugRender();boot();
</script>
