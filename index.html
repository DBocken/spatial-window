<!doctype html>
<html lang="de">
<head>

<meta name="theme-color" content="#eef3f8">
<title>Spatial Window</title>
<style>

</style>
</head>
<body>
<main id="stage">
<div id="ui"><div id="statusBox" class="panel"><div id="status">Initialisiere …</div><div id="detail">JS startet</div></div><div id="buttons"><button id="startBtn" class="primary" disabled>Spatial starten</button><button id="debugBtn">Debug öffnen</button><button id="calBtn" disabled>Kalibrieren</button></div></div>

<div id="hint">Starte Spatial, halte das Handy möglichst still und bewege nur den Kopf seitlich. Achte besonders auf den nahen weißen Rahmen und die farbigen Objekte dahinter.</div><div id="fatal"></div>
</main>
<script type="module">
const $=id=>document.getElementById(id),stage=$("stage"),video=$("video"),faceCanvas=$("faceCanvas"),faceCtx=faceCanvas.getContext("2d"),statusEl=$("status"),detailEl=$("detail"),startBtn=$("startBtn"),debugBtn=$("debugBtn"),debugEl=$("debug"),debugText=$("debugText"),calBtn=$("calBtn"),hintEl=$("hint"),fatalEl=$("fatal");
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),lerp=(a,b,t)=>a+(b-a)*t;
const VIEW_SCALE=1.45,HEAD_GAIN_X=0.28,HEAD_GAIN_Y=0.24;
let dbg={secure:isSecureContext,protocol:location.protocol,mediaDevices:!!navigator.mediaDevices,getUserMedia:!!navigator.mediaDevices?.getUserMedia,permission:"unknown",camera:"not started",track:"-",video:"0x0",mediapipe:"not loaded",moduleUrl:"-",wasm:"not loaded",model:"not loaded",delegate:"-",faces:0,landmarks:0,fps:0,lastError:"-"};
function debugRender(){debugText.textContent=`Secure context: ${dbg.secure}\nProtocol: ${dbg.protocol}\nmediaDevices: ${dbg.mediaDevices}\ngetUserMedia: ${dbg.getUserMedia}\nCamera permission: ${dbg.permission}\nCamera: ${dbg.camera}\nTrack: ${dbg.track}\nVideo: ${dbg.video}\nMediaPipe module: ${dbg.mediapipe}\nModule URL: ${dbg.moduleUrl}\nWASM: ${dbg.wasm}\nFace model: ${dbg.model}\nDelegate: ${dbg.delegate}\nFaces: ${dbg.faces}\nLandmarks: ${dbg.landmarks}\nDetection FPS: ${dbg.fps}\nView scale: ${VIEW_SCALE}x\nHead gain X/Y: ${HEAD_GAIN_X} / ${HEAD_GAIN_Y}\n\nLast error:\n${dbg.lastError}`}
function setErr(stageName,e){const name=e?.name||"Error",msg=e?.message||String(e);dbg.lastError=`[${stageName}] ${name}: ${msg}`;debugRender();console.error(stageName,e)}
function fatal(msg){fatalEl.style.display="block";fatalEl.textContent=msg;statusEl.textContent="Fehler"}
window.addEventListener("error",e=>{setErr("window.error",e.error||e.message);fatal("JS-Fehler:\n"+(e.message||"unbekannt"))});window.addEventListener("unhandledrejection",e=>{setErr("unhandledrejection",e.reason);fatal("Promise-Fehler:\n"+(e.reason?.message||e.reason||"unbekannt"))});
let THREE,renderer,scene,camera,torus,orb,frame,model;let ready=false,drag=false,tracking=false,faceLandmarker=null,stream=null,lastVideo=-1,lastDetect=0,lastFace=0,mode="touch",detectCounter=0,fpsSince=performance.now(),calibrated=false;let latestRawEye={x:0,y:0,z:.42};

async function permissionInfo(){try{if(navigator.permissions?.query){const p=await navigator.permissions.query({name:"camera"});dbg.permission=p.state;p.onchange=()=>{dbg.permission=p.state;debugRender()}}}catch{dbg.permission="query unsupported"}debugRender()}
async function boot(){try{await permissionInfo();THREE=await import("https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js");renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:"high-performance"});renderer.domElement.className="scene";renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.18;renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;stage.prepend(renderer.domElement);scene=new THREE.Scene();scene.background=new THREE.Color(0xeef3f8);camera=new THREE.PerspectiveCamera(50,1,.006,4);scene.add(new THREE.HemisphereLight(0xffffff,0xb7c5d8,3.2));const key=new THREE.DirectionalLight(0xffffff,4.5);key.position.set(-.25,.48,.35);key.castShadow=true;key.shadow.mapSize.set(1024,1024);scene.add(key);const fill=new THREE.DirectionalLight(0xd9ecff,2.2);fill.position.set(.35,.12,.15);scene.add(fill);const warm=new THREE.PointLight(0xffd2a3,3.0,1.4,2);warm.position.set(-.12,.15,-.45);scene.add(warm);buildWorld();resize();addEventListener("resize",resize,{passive:true});ready=true;startBtn.disabled=false;statusEl.textContent="Bereit · helle Szene";detailEl.textContent=`Modus: touch\nEye: 0.0 / 0.0 / 42.0 cm`;requestAnimationFrame(loop)}catch(e){setErr("boot",e);fatal("Three.js konnte nicht geladen werden:\n"+(e.message||e))}}
function mesh(g,m,x,y,z,parent=scene){const o=new THREE.Mesh(g,m);o.position.set(x,y,z);o.castShadow=o.receiveShadow=true;parent.add(o);return o}
function buildWorld(){
  const floorMat=new THREE.MeshStandardMaterial({color:0xdce4ed,metalness:.02,roughness:.82});
  const floor=mesh(new THREE.PlaneGeometry(.28,1.15),floorMat,0,-.125,-.55);floor.rotation.x=-Math.PI/2;
  const grid=new THREE.GridHelper(.28,20,0x8fa2b7,0xb8c5d3);grid.position.set(0,-.123,-.56);grid.material.transparent=true;grid.material.opacity=.5;scene.add(grid);
  const back=mesh(new THREE.PlaneGeometry(.28,.38),new THREE.MeshStandardMaterial({color:0xfafcff,roughness:.92}),0,.055,-1.00);
  const leftWall=mesh(new THREE.PlaneGeometry(1.05,.38),new THREE.MeshStandardMaterial({color:0xe4edf7,roughness:.9,side:THREE.DoubleSide}),-.14,.055,-.48);leftWall.rotation.y=Math.PI/2;
  const rightWall=mesh(new THREE.PlaneGeometry(1.05,.38),new THREE.MeshStandardMaterial({color:0xe8f0f8,roughness:.9,side:THREE.DoubleSide}),.14,.055,-.48);rightWall.rotation.y=Math.PI/2;

  frame=new THREE.Group();
  const frameMat=new THREE.MeshStandardMaterial({color:0xffffff,metalness:.08,roughness:.32});
  for(const [x,y,sx,sy] of [[0,-.102,.104,.012],[0,.102,.104,.012],[-.052,0,.012,.204],[.052,0,.012,.204]]){const b=new THREE.Mesh(new THREE.BoxGeometry(sx,sy,.016),frameMat);b.position.set(x,y,0);b.castShadow=true;frame.add(b)}
  frame.position.set(0,.005,-.105);scene.add(frame);

  const nearPillar=mesh(new THREE.BoxGeometry(.018,.19,.028),new THREE.MeshStandardMaterial({color:0x27364a,metalness:.25,roughness:.38}),-.035,-.025,-.235);
  const nearBadge=mesh(new THREE.SphereGeometry(.019,28,20),new THREE.MeshStandardMaterial({color:0xff695e,roughness:.28,metalness:.05}),.031,.035,-.285);

  torus=mesh(new THREE.TorusGeometry(.031,.007,20,64),new THREE.MeshStandardMaterial({color:0x316df4,metalness:.32,roughness:.24}),-.038,.032,-.42);torus.rotation.set(Math.PI/2.45,.3,0);
  orb=mesh(new THREE.IcosahedronGeometry(.028,2),new THREE.MeshStandardMaterial({color:0xffb52f,metalness:.08,roughness:.3}),.045,-.005,-.55);

  const glassMat=new THREE.MeshPhysicalMaterial({color:0x7bd8ff,transparent:true,opacity:.34,roughness:.08,metalness:.0,transmission:.45,thickness:.008});
  const glass=mesh(new THREE.BoxGeometry(.07,.105,.008),glassMat,0,.03,-.67);glass.rotation.y=.28;

  model=new THREE.Group();model.position.set(-.012,-.083,-.72);scene.add(model);
  const bodyMat=new THREE.MeshStandardMaterial({color:0x55b980,metalness:.18,roughness:.35}),darkMat=new THREE.MeshStandardMaterial({color:0x26313f,roughness:.52});
  const body=new THREE.Mesh(new THREE.BoxGeometry(.072,.026,.038),bodyMat);body.position.y=.018;body.castShadow=true;model.add(body);
  const cabin=new THREE.Mesh(new THREE.BoxGeometry(.038,.025,.033),bodyMat);cabin.position.set(-.005,.042,0);cabin.castShadow=true;model.add(cabin);
  for(const x of [-.024,.024])for(const z of [-.023,.023]){const w=new THREE.Mesh(new THREE.CylinderGeometry(.010,.010,.008,20),darkMat);w.rotation.x=Math.PI/2;w.position.set(x,.008,z);model.add(w)}

  const colors=[0x6b7cff,0xff7f6b,0x53c7a1,0xffc94f,0x9d73ff];
  for(let i=0;i<5;i++){const h=.07+i*.014;const c=mesh(new THREE.BoxGeometry(.028,h,.028),new THREE.MeshStandardMaterial({color:colors[i],metalness:.08,roughness:.38}),-.085+i*.043,-.125+h/2,-.82-(i%2)*.055);c.rotation.y=(i-2)*.08}

  for(let i=0;i<22;i++){const p=mesh(new THREE.SphereGeometry(.0036,10,8),new THREE.MeshBasicMaterial({color:i%2?0x3879ff:0xff8f5a}),(Math.random()-.5)*.19,-.07+Math.random()*.22,-.22-Math.random()*.68);p.scale.setScalar(.7+Math.random()*1.1)}

  const backFrameMat=new THREE.MeshStandardMaterial({color:0x90a4bb,metalness:.15,roughness:.55});
  for(const x of [-.095,0,.095])mesh(new THREE.BoxGeometry(.004,.32,.015),backFrameMat,x,.04,-.985);
  for(const y of [-.09,.04,.17])mesh(new THREE.BoxGeometry(.24,.004,.015),backFrameMat,0,y,-.985);
}
function resize(){if(renderer)renderer.setSize(innerWidth,innerHeight,false)}
function screenM(){const s=innerHeight>=innerWidth?{w:.068,h:.151}:{w:.151,h:.068};return{w:s.w*VIEW_SCALE,h:s.h*VIEW_SCALE}}
function project(e){const n=.006,f=4,s=screenM(),z=Math.max(.18,e.z),l=n*((-s.w/2)-e.x)/z,r=n*((s.w/2)-e.x)/z,b=n*((-s.h/2)-e.y)/z,t=n*((s.h/2)-e.y)/z;camera.position.set(e.x,e.y,e.z);camera.rotation.set(0,0,0);camera.projectionMatrix.makePerspective(l,r,t,b,n,f,camera.coordinateSystem);camera.projectionMatrixInverse.copy(camera.projectionMatrix).invert();camera.updateMatrixWorld(true)}
stage.addEventListener("pointerdown",e=>{if(!ready||tracking)return;drag=true;stage.setPointerCapture?.(e.pointerId);mode="touch"});stage.addEventListener("pointermove",e=>{if(!drag||tracking)return;const r=stage.getBoundingClientRect(),nx=(e.clientX-r.left)/r.width*2-1,ny=(e.clientY-r.top)/r.height*2-1;target.x=clamp(nx*.075,-.09,.09);target.y=clamp(-ny*.055,-.07,.07);target.z=.42});stage.addEventListener("pointerup",()=>drag=false);stage.addEventListener("pointercancel",()=>drag=false);
async function gyro(){if(!("DeviceOrientationEvent" in window))return false;let got=false;addEventListener("deviceorientation",e=>{if(typeof e.gamma!=="number")return;got=true;if(!tracking||performance.now()-lastFace>800){target.x=clamp(e.gamma/45,-1,1)*.055;target.y=clamp((e.beta-45)/45,-1,1)*-.04;target.z=.42;if(!tracking)mode="gyro"}},{passive:true});await new Promise(r=>setTimeout(r,400));return got}
async function importMediaPipe(){const urls=["https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.21/vision_bundle.mjs","https://unpkg.com/@mediapipe/tasks-vision@0.10.21/vision_bundle.mjs?module"];let last;for(const url of urls){dbg.moduleUrl=url;dbg.mediapipe="loading";debugRender();try{const mp=await import(url);dbg.mediapipe="loaded";debugRender();return mp}catch(e){last=e;setErr("MediaPipe import",e)}}dbg.mediapipe="FAILED";debugRender();throw last||new Error("MediaPipe module could not be loaded")}
async function face(){dbg.camera="requesting";debugRender();try{stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:"user",width:{ideal:640},height:{ideal:480},frameRate:{ideal:30,max:30}}})}catch(e){dbg.camera="FAILED";setErr("getUserMedia",e);throw e}dbg.camera="stream acquired";const track=stream.getVideoTracks()[0],settings=track?.getSettings?.()||{};dbg.track=track?`${track.label||"camera"} | ${track.readyState} | ${settings.width||"?"}x${settings.height||"?"}@${settings.frameRate||"?"}`:"no video track";video.srcObject=stream;try{await video.play()}catch(e){setErr("video.play",e);throw e}await new Promise(r=>{if(video.videoWidth)return r();const done=()=>{video.removeEventListener("loadedmetadata",done);r()};video.addEventListener("loadedmetadata",done);setTimeout(done,1500)});dbg.video=`${video.videoWidth}x${video.videoHeight} readyState=${video.readyState}`;dbg.camera="PLAYING";debugRender();
let mp;try{mp=await importMediaPipe()}catch(e){throw e}
let vision;dbg.wasm="loading";debugRender();try{vision=await mp.FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.21/wasm");dbg.wasm="loaded";debugRender()}catch(e){dbg.wasm="FAILED";setErr("WASM",e);throw e}
const opt={baseOptions:{modelAssetPath:"https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",delegate:"GPU"},runningMode:"VIDEO",numFaces:1,minFaceDetectionConfidence:.45,minFacePresenceConfidence:.45,minTrackingConfidence:.45};dbg.model="loading";dbg.delegate="GPU";debugRender();try{faceLandmarker=await mp.FaceLandmarker.createFromOptions(vision,opt);dbg.model="loaded"}catch(e){setErr("Face model GPU",e);dbg.delegate="CPU fallback";opt.baseOptions.delegate="CPU";debugRender();try{faceLandmarker=await mp.FaceLandmarker.createFromOptions(vision,opt);dbg.model="loaded";dbg.delegate="CPU"}catch(e2){dbg.model="FAILED";setErr("Face model CPU",e2);throw e2}}tracking=true;mode="face";calBtn.disabled=false;statusEl.textContent="Face Tracking aktiv";hintEl.textContent="Handy still halten und nur den Kopf seitlich bewegen. Der weiße Vorderrahmen sollte deutlich anders wandern als die Rückwand.";debugRender()}
function eye(f){if(!f||f.length<474||!video.videoWidth)return null;const L=f[468],R=f[473],vw=video.videoWidth,vh=video.videoHeight,lx=L.x*vw,ly=L.y*vh,rx=R.x*vw,ry=R.y*vh,d=Math.hypot(rx-lx,ry-ly);if(d<8)return null;const fx=vw/(2*Math.tan(65*Math.PI/360)),z=clamp(fx*.063/d,.24,.75),cx=(lx+rx)/2,cy=(ly+ry)/2;return{x:clamp(-((cx-vw/2)*z)/fx,-.18,.18),y:clamp(-((cy-vh/2)*z)/fx,-.15,.15),z}}
function drawFace(f){const w=video.videoWidth,h=video.videoHeight;if(!w||!h)return;faceCanvas.width=w;faceCanvas.height=h;faceCtx.clearRect(0,0,w,h);if(!f)return;faceCtx.fillStyle="#7CFFB2";const ids=[33,133,362,263,468,469,470,471,472,473,474,475,476,477,1,4,10,152];for(const id of ids){const p=f[id];if(!p)continue;faceCtx.beginPath();faceCtx.arc(p.x*w,p.y*h,id>=468?4:2.5,0,Math.PI*2);faceCtx.fill()}const xs=f.map(p=>p.x*w),ys=f.map(p=>p.y*h),minX=Math.min(...xs),maxX=Math.max(...xs),minY=Math.min(...ys),maxY=Math.max(...ys);faceCtx.strokeStyle="#7CFFB2";faceCtx.lineWidth=2;faceCtx.strokeRect(minX,minY,maxX-minX,maxY-minY)}
startBtn.addEventListener("click",async()=>{startBtn.disabled=true;startBtn.textContent="Starte …";const g=await gyro();try{await face();startBtn.textContent="Spatial aktiv"}catch(e){mode=g?"gyro":"touch";statusEl.textContent=g?"Gyro aktiv":"Nur Touch möglich";hintEl.textContent="Face Tracking konnte nicht vollständig starten. Debug zeigt die genaue Stufe.";startBtn.disabled=false;startBtn.textContent="Erneut prüfen";setErr("Spatial start",e)}});
debugBtn.addEventListener("click",()=>{const open=debugEl.style.display==="grid";debugEl.style.display=open?"none":"grid";debugBtn.textContent=open?"Debug öffnen":"Debug schließen";debugRender()});
calBtn.addEventListener("click",()=>{neutral.x=latestRawEye.x;neutral.y=latestRawEye.y;neutral.z=latestRawEye.z;calibrated=true;hintEl.textContent="Kalibriert. Jetzt nur den Kopf bewegen, nicht das Handy."});
let prev=performance.now();function loop(now){requestAnimationFrame(loop);const dt=clamp((now-prev)/1000,.001,.05);prev=now;if(tracking&&faceLandmarker&&video.readyState>=2&&now-lastDetect>=50&&video.currentTime!==lastVideo){lastDetect=now;lastVideo=video.currentTime;try{const res=faceLandmarker.detectForVideo(video,now),f=res.faceLandmarks?.[0];dbg.faces=res.faceLandmarks?.length||0;dbg.landmarks=f?.length||0;detectCounter++;if(now-fpsSince>1000){dbg.fps=detectCounter;detectCounter=0;fpsSince=now;debugRender()}drawFace(f);const e=eye(f);if(e){latestRawEye=e;if(!calibrated){neutral.x=e.x;neutral.y=e.y;neutral.z=e.z;calibrated=true}target.x=clamp((e.x-neutral.x)*HEAD_GAIN_X,-.018,.018);target.y=clamp((e.y-neutral.y)*HEAD_GAIN_Y,-.014,.014);target.z=clamp(lerp(neutral.z,e.z,.06),.34,.56);lastFace=now;mode="face"}}catch(e){setErr("detectForVideo",e)}}const a=1-Math.exp(-dt*13);smooth.x=lerp(smooth.x,target.x,a);smooth.y=lerp(smooth.y,target.y,a);smooth.z=lerp(smooth.z,target.z,a*.45);project(smooth);if(torus)torus.rotation.z+=dt*.33;if(orb){orb.rotation.x+=dt*.26;orb.rotation.y+=dt*.38}if(frame)frame.rotation.y=Math.sin(now*.0005)*.012;if(model)model.rotation.y=Math.sin(now*.00036)*.045;detailEl.textContent=`Modus: ${mode}\nEye: ${(smooth.x*100).toFixed(1)} / ${(smooth.y*100).toFixed(1)} / ${(smooth.z*100).toFixed(1)} cm`;renderer.render(scene,camera)}
addEventListener("pagehide",()=>{try{stream?.getTracks().forEach(t=>t.stop())}catch{}try{faceLandmarker?.close?.()}catch{}});debugRender();boot();
</script>
