name: Tune subtle spatial effect

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Reduce spatial effect to subtle level
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          s = s.replace('const VIEW_SCALE=1.45,HEAD_GAIN_X=0.95,HEAD_GAIN_Y=0.85;', 'const VIEW_SCALE=1.45,HEAD_GAIN_X=0.28,HEAD_GAIN_Y=0.24;')
          s = s.replace('target.x=clamp((e.x-neutral.x)*HEAD_GAIN_X,-.060,.060);target.y=clamp((e.y-neutral.y)*HEAD_GAIN_Y,-.050,.050);target.z=clamp(lerp(neutral.z,e.z,.18),.30,.62);', 'target.x=clamp((e.x-neutral.x)*HEAD_GAIN_X,-.018,.018);target.y=clamp((e.y-neutral.y)*HEAD_GAIN_Y,-.014,.014);target.z=clamp(lerp(neutral.z,e.z,.06),.34,.56);')
          p.write_text(s)
          PY
          if git diff --quiet -- index.html; then
            echo "No patch needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Reduce spatial effect strength substantially"
          git push
